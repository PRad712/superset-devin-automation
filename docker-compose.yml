services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  mock-devin:
    profiles: ["demo"]
    image: python:3.11-slim
    volumes:
      - ./scripts:/scripts:ro
    command: ["python", "/scripts/mock_devin_api.py", "--port", "9000"]
